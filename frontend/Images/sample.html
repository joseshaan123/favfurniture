<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Image Slider with Radio Buttons (Grid Version)</title>
  <style>
    /* General styles */
    body, html {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
    }

    /* Grid layout for multiple sliders */
    .sliders {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    /* Slider container */
    .slider-container {
      position: relative;
      width: 100%;
      height: 700px;
      overflow: hidden;
      
     
    }

    /* Slides wrapper using Grid */
    .slides {
      display: grid;
      grid-template-columns: repeat(4, 100%);
      transition: transform 1s ease-in-out;
    }

    /* Individual slide using Grid */
    .slide {
      position: relative;
      display: grid;
      grid-template-rows: 1fr;
    }

    /* Slide images */
    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Navigation dots (radio buttons) */
    .navigation {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
    }

    .navigation input[type="radio"] {
      display: none;
    }

    .navigation label {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background-color: #ccc;
      cursor: pointer;
    }

    .navigation input:checked + label {
      background-color: #333;
    }


    .slider-container2 {
      position: relative;
      width: 100%;
      height: 300px;
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    /* Slides wrapper using Grid */
    .slides2 {
      display: grid;
      grid-template-columns: repeat(4, 100%);
      transition: transform 1s ease-in-out;
    }

    /* Individual slide using Grid */
    .slide2 {
      position: relative;
      display: grid;
      grid-template-rows: 1fr;
    }

    /* Slide images */
    .slide2 img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Navigation dots (radio buttons) */
    .navigation2 {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
    }

    .navigation2 input[type="radio"] {
      display: none;
    }

    .navigation2 label {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background-color: #ccc;
      cursor: pointer;
    }

    .navigation2 input:checked + label {
      background-color: #333;
    }
    .slide1 p{
     margin: 0 auto;
    }

    .slide2 p{
     margin: 0 auto;
    }
  </style>
</head>
<body>

  
    <!-- First Slider -->
    <div class="slider-container">
      <div class="slides">
        <div class="slide"><img src="mugd.jpg" alt="Slide 1"></div>
        <div class="slide"><img src="chairs.jpg" alt="Slide 2"></div>
        <div class="slide"><img src="gaming setups.jpg" alt="Slide 3"></div>
        <div class="slide"><img src="mugd.jpg" alt="Slide 4"></div>
      </div>
      <div class="navigation">
        <input type="radio" name="slider1" id="slider1-1" checked>
        <label for="slider1-1"></label>
        <input type="radio" name="slider1" id="slider1-2">
        <label for="slider1-2"></label>
        <input type="radio" name="slider1" id="slider1-3">
        <label for="slider1-3"></label>
        <input type="radio" name="slider1" id="slider1-4">
        <label for="slider1-4"></label>
      </div>
    </div>

    <div class="sliders">
    <!-- Second Slider -->
    <div class="slide1">
    <div class="slider-container2">
      <div class="slides2">
        <div class="slide2"><img src="mugd.jpg" alt="Slide 1"></div>
        <div class="slide2"><img src="chairs.jpg" alt="Slide 2"></div>
        <div class="slide2"><img src="gaming setups.jpg" alt="Slide 3"></div>
        <div class="slide2"><img src="mugd.jpg" alt="Slide 4"></div>
      </div>
      <div class="navigation2">
        <input type="radio" name="slider2-1" id="slider2-1" checked>
        <label for="slider2-1"></label>
        <input type="radio" name="slider2-1" id="slider2-2">
        <label for="slider2-2"></label>
        <input type="radio" name="slider2-1" id="slider2-3">
        <label for="slider2-3"></label>
        <input type="radio" name="slider2-1" id="slider2-4">
        <label for="slider2-4"></label>
      </div>
      
    </div>
    <p>Mugs</p>
    </div>
    <div class="slide2">
    <div class="slider-container2">
        <div class="slides2">
          <div class="slide2"><img src="mugd.jpg" alt="Slide 1"></div>
          <div class="slide2"><img src="chairs.jpg" alt="Slide 2"></div>
          <div class="slide2"><img src="gaming setups.jpg" alt="Slide 3"></div>
          <div class="slide2"><img src="mugd.jpg" alt="Slide 4"></div>
        </div>
        <div class="navigation2">
          <input type="radio" name="slider2-2" id="slider3-1" checked>
          <label for="slider3-1"></label>
          <input type="radio" name="slider2-2" id="slider3-2">
          <label for="slider3-2"></label>
          <input type="radio" name="slider2-2" id="slider3-3">
          <label for="slider3-3"></label>
          <input type="radio" name="slider2-2" id="slider3-4">
          <label for="slider3-4"></label>
        </div>
        
    </div>
    <p>Mugs</p>
</div>
  </div>

  <!-- Inline JavaScript -->
  <script>
    document.querySelectorAll('.slider-container').forEach((sliderContainer, index) => {
      const slides = sliderContainer.querySelector('.slides');
      const radios = sliderContainer.querySelectorAll('.navigation input');
      let currentIndex = 0;

      // Function to change the slide
      function changeSlide(newIndex) {
        currentIndex = newIndex;
        slides.style.transform = `translateX(-${currentIndex * 100}%)`;
        radios[currentIndex].checked = true;
      }

      // Auto slide function
      function autoSlide() {
        currentIndex++;
        if (currentIndex >= radios.length) currentIndex = 0;
        changeSlide(currentIndex);
      }

      // Start auto-slide
      let autoSlideInterval = setInterval(autoSlide, 5000);

      // Manual control using radio buttons
      radios.forEach((radio, i) => {
        radio.addEventListener('click', () => {
          clearInterval(autoSlideInterval);
          changeSlide(i);
          autoSlideInterval = setInterval(autoSlide, 5000);
        });
      });
    });



    document.querySelectorAll('.slider-container2').forEach((sliderContainer2, index2) => {
      const slides2 = sliderContainer2.querySelector('.slides2');
      const radios2 = sliderContainer2.querySelectorAll('.navigation2 input');
      let currentIndex2 = 0;

      // Function to change the slide
      function changeSlide2(newIndex2) {
        currentIndex2 = newIndex2;
        slides2.style.transform = `translateX(-${currentIndex2 * 100}%)`;
        radios2[currentIndex2].checked = true;
      }

      // Auto slide function
      function autoSlide2() {
        currentIndex2++;
        if (currentIndex2 >= radios2.length) currentIndex2 = 0;
        changeSlide2(currentIndex2);
      }

      // Start auto-slide
      let autoSlideInterval2 = setInterval(autoSlide2, 5000);

      // Manual control using radio buttons
      radios2.forEach((radio2, i) => {
        radio2.addEventListener('click', () => {
          clearInterval(autoSlideInterval2);
          changeSlide2(i);
          autoSlideInterval2 = setInterval(autoSlide2, 5000);
        });
      });
    });
  </script>

</body>
</html>
